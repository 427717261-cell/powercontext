<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>迷你知识库 · 端侧向量化 + seekdb 混合检索</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <h1>迷你知识库</h1>
          <span class="sub">浏览器端向量化 · seekdb 向量+全文混合检索</span>
        </div>
        <div class="badges">
          <span id="badge-backend" class="badge" title="当前推理后端">后端检测中…</span>
          <span id="badge-model" class="badge" title="模型与精度">模型未加载</span>
          <span id="badge-db" class="badge" title="seekdb 连接">seekdb 未连接</span>
        </div>
      </header>

      <div class="toolbar">
        <label class="inline">
          推理后端
          <select id="backend-select" title="强制切换后端（会重新加载页面）">
            <option value="">自动（优先 WebGPU）</option>
            <option value="webgpu">强制 WebGPU</option>
            <option value="wasm">强制 WASM</option>
          </select>
        </label>
        <span class="sep"></span>
        <span id="pending-hint" class="hint hidden"></span>
        <button id="btn-refresh" class="ghost">刷新索引</button>
        <span class="spacer"></span>
        <a class="link" href="/bench.html">量化与性能实测 →</a>
      </div>

      <main class="grid">
        <!-- 左：导入 -->
        <section class="card">
          <h2>1 · 导入文档</h2>
          <div class="row">
            <select id="collection" title="集合（数据表）"><option>docs</option></select>
            <button id="btn-new-collection" class="ghost">新建集合</button>
            <button id="btn-del-collection" class="ghost danger">删除当前</button>
          </div>
          <input id="doc-title" type="text" placeholder="文档标题（可选）" />
          <textarea id="doc-text" rows="7" placeholder="粘贴文本，或拖入 / 选择 .txt .md 文件…&#10;长文档会自动分块（约 200 字/块，重叠 40 字）"></textarea>
          <div class="row">
            <input id="file-input" type="file" accept=".txt,.md,.markdown,text/plain" multiple hidden />
            <button id="btn-pick-file" class="ghost">选择文件</button>
            <label class="chk"><input id="use-sample" type="checkbox" checked /> 附带示例文档</label>
            <label class="chk"><input id="auto-refresh" type="checkbox" checked /> 导入后自动刷新索引</label>
            <label class="chk">批大小 <input id="batch-size" type="number" min="1" max="32" value="8" class="tiny" /></label>
            <span class="spacer"></span>
            <button id="btn-import" class="primary">向量化并写入</button>
          </div>
          <div id="import-progress" class="progress hidden">
            <div class="bar"><i id="import-bar"></i></div>
            <span id="import-label"></span>
          </div>
          <table id="import-metrics" class="metrics hidden"></table>
        </section>

        <!-- 右：检索 -->
        <section class="card">
          <h2>2 · 检索</h2>
          <div class="row">
            <input id="query" type="text" placeholder="输入查询…" />
            <select id="mode" title="检索模式">
              <option value="hybrid">混合检索</option>
              <option value="vector">向量</option>
              <option value="fulltext">全文</option>
            </select>
            <input id="topk" type="number" min="1" max="50" value="8" title="Top K" class="topk" />
            <button id="btn-search" class="primary">搜索</button>
          </div>
          <div id="query-history" class="chips"></div>
          <div id="search-timing" class="timing"></div>
          <div id="results" class="results"><p class="empty">暂无结果。先导入文档，再输入查询。</p></div>
        </section>
      </main>

      <!-- 文档列表 -->
      <section class="card wide">
        <div class="row between">
          <h2>知识库内容 <span id="doc-count" class="count"></span></h2>
          <button id="btn-clear" class="ghost danger">清空当前集合</button>
        </div>
        <div id="doc-list" class="doclist"><p class="empty">加载中…</p></div>
      </section>

      <footer class="foot">
        <span id="foot-note">模型仅在浏览器本地推理，不调用云端 API；向量与全文存储、混合检索全部由 seekdb 完成。</span>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
