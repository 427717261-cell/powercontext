<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>模型量化与检索质量实测 · 迷你知识库</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <h1>量化与性能实测</h1>
          <span class="sub">同一评测集，比较 FP32 / FP16 / INT8 × WebGPU / WASM 的体积、速度与检索质量</span>
        </div>
        <div class="badges">
          <a class="link" href="/">← 返回知识库</a>
        </div>
      </header>

      <section class="card">
        <h2>1 · 选择配置</h2>
        <div id="configs" class="row"></div>
        <div class="row">
          <label class="chk">每配置重复轮次 <input id="rounds" type="number" min="1" max="5" value="3" class="tiny" /></label>
          <label class="chk">批大小 <input id="batch" type="number" min="1" max="32" value="8" class="tiny" /></label>
          <span class="spacer"></span>
          <button id="btn-run" class="primary">开始实测</button>
          <button id="btn-json" class="ghost" disabled>下载 JSON</button>
          <button id="btn-md" class="ghost" disabled>复制 Markdown 表格</button>
        </div>
        <p class="empty" id="env-note"></p>
        <div id="progress" class="progress hidden"><div class="bar"><i id="bar"></i></div><span id="label"></span></div>
        <div id="log" class="bench-log"></div>
      </section>

      <section class="card">
        <h2>2 · 结果</h2>
        <div id="summary"><p class="empty">尚未运行。</p></div>
      </section>

      <section class="card">
        <h2>3 · 逐查询明细（第一轮）</h2>
        <div id="detail"><p class="empty">尚未运行。</p></div>
      </section>

      <footer class="foot">
        指标口径：Recall@K / nDCG@10 以 data/eval-queries.json 的 qrels 为准；检索走应用同一条 seekdb 混合检索（RRF）路径。
      </footer>
    </div>
    <script type="module" src="/src/bench.js"></script>
  </body>
</html>
